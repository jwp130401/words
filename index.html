<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단어 시험 시스템</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --primary: #10b981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --text: #1f2937;
      --text-sub: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 헤더 Bar */
    .header {
      background: #fff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .badge-title {
      background: #d1fae5; color: #047857;
      padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem;
    }
    .exam-title { font-weight: 700; font-size: 1.05rem; }
    .header-right { display: flex; gap: 8px; }
    .top-btn {
      background: #f3f4f6; border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;
      cursor: pointer; font-weight: 600; color: var(--text-sub);
    }
    .top-btn:hover { background: #e5e7eb; }

    /* 메인 컨테이너 */
    .main-wrapper {
      flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .quiz-card {
      background: var(--card-bg);
      width: 100%; max-width: 520px;
      border-radius: 20px;
      padding: 32px 24px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    /* 진행 상단 정보 */
    .q-progress {
      text-align: center; font-size: 0.85rem; font-weight: 700; color: var(--primary); margin-bottom: 12px;
    }
    .q-type-title { font-size: 0.85rem; color: var(--text-sub); text-align: center; margin-bottom: 8px; }
    .q-word-display { font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 24px; color: #111827; }

    /* 보기 목록 */
    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .option-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border: 1px solid var(--border); border-radius: 12px;
      background: #fff; cursor: pointer; transition: all 0.15s; font-size: 0.95rem;
    }
    .option-item:hover { border-color: #9ca3af; background: #f9fafb; }
    .option-item .num {
      width: 24px; height: 24px; border-radius: 6px; background: #f3f4f6;
      display: flex; justify-content: center; align-items: center;
      font-size: 0.8rem; font-weight: 700; color: var(--text-sub); margin-right: 12px;
    }
    .option-item .text { flex: 1; text-align: left; }

    /* 제출 전 선택 상태 표시 */
    .option-item.selected-choice {
      border: 2px solid #3b82f6; background: #eff6ff; font-weight: 700; color: #1d4ed8;
    }
    .option-item.selected-choice .num { background: #3b82f6; color: #fff; }

    /* 좌우 탐색 화살표 */
    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border-radius: 50%; background: #fff;
      border: 1px solid var(--border); display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: 700; color: var(--text-sub);
    }
    .nav-arrow.prev { left: -18px; }
    .nav-arrow.next { right: -18px; }

    /* 폼 요소 */
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    select, textarea {
      width: 100%; padding: 10px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.9rem;
    }

    .btn-action {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: var(--primary); color: white; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s; margin-top: 8px;
    }
    .btn-action:hover { background: var(--primary-hover); }
    .btn-action:disabled {
      background: #9ca3af; cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
      background: #ffffff; color: var(--text); font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s; margin-top: 8px;
    }
    .btn-secondary:hover { background: #f3f4f6; }

    .hidden { display: none !important; }

    /* OMR 모달 레이어 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: white; border-radius: 16px; padding: 24px; width: 90%; max-width: 400px; text-align: center;
    }
    .modal-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; max-height: 300px; overflow-y: auto;
    }
    .grid-item {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
      display: flex; justify-content: center; align-items: center; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; margin: 0 auto;
    }
    .grid-item.answered { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }

    /* 결과 배지 */
    .result-badge {
      display: inline-block; padding: 6px 16px; border-radius: 20px;
      font-size: 1.1rem; font-weight: 800; margin-bottom: 12px;
    }
    .result-badge.pass { background: #d1fae5; color: #047857; }
    .result-badge.fail { background: #fee2e2; color: #b91c1c; }

    .timer-box {
      margin: 16px 0; padding: 14px; background: #fff5f5; border: 1px solid #fecaca;
      border-radius: 12px; color: #b91c1c; font-weight: 700;
    }

    /* 단어 복습 오답노트 박스 */
    .review-box {
      margin-top: 16px; text-align: left; max-height: 250px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: #fafafa;
    }
    .review-item {
      padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.9rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .review-item:last-child { border-bottom: none; }
    .review-item .w-eng { font-weight: 700; color: #111827; }
    .review-item .w-kor { color: #4b5563; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span class="badge-title">출제</span>
      <span class="exam-title">중·고등 필수 어휘 모의고사</span>
    </div>
    <div class="header-right">
      <button class="top-btn" onclick="openStatusModal()">📊 OMR 답안지</button>
    </div>
  </div>

  <div class="main-wrapper">

    <div id="screen-main" class="quiz-card">
      <h2 style="margin-bottom: 20px; font-size:1.3rem;">단어 시험 설정</h2>
      <div class="form-group">
        <label>단어장 선택 (각 Day당 40개 단어)</label>
        <select id="daySelect" onchange="loadDayData()">
          <option value="ALL">전체 단어장 (통합 랜덤 40개)</option>
          <option value="DAY1" selected>Day 1 (40개 단어)</option>
          <option value="DAY2">Day 2 (40개 단어)</option>
          <option value="DAY3">Day 3 (40개 단어)</option>
          <option value="DAY4">Day 4 (40개 단어)</option>
          <option value="DAY5">Day 5 (40개 단어)</option>
        </select>
      </div>
      <div class="form-group">
        <label>합격 기준</label>
        <div style="font-size: 0.9rem; font-weight: 700; color: var(--primary); padding: 8px 0;">
          📌 커트라인: 80점 이상 (40문제 중 32개 이상 정답)
        </div>
      </div>
      <div class="form-group">
        <label>선택된 단어 목록 (수정 가능)</label>
        <textarea id="wordInput" rows="8" placeholder="영단어, 뜻 형식으로 입력하세요"></textarea>
      </div>
      <button class="btn-action" onclick="startQuiz()">시험 시작하기 (40문제 무작위)</button>
    </div>

    <div id="screen-quiz" class="quiz-card hidden">
      <div id="navPrev" class="nav-arrow prev" onclick="prevQuestion()">❮</div>
      <div id="navNext" class="nav-arrow next" onclick="nextQuestion()">❯</div>

      <div id="qProgress" class="q-progress">문제 1 / 40</div>
      <div id="qTypeTitle" class="q-type-title">다음 단어의 뜻은?</div>
      <div id="questionWord" class="q-word-display">-</div>

      <div id="optionsContainer" class="options-list"></div>

      <button id="btnSubmit" class="btn-action hidden" style="margin-top: 24px;" onclick="finishQuiz()">최종 제출하기</button>
    </div>

    <div id="screen-result" class="quiz-card hidden" style="text-align: center;">
      <div id="resultBadge" class="result-badge pass">합격</div>
      <h2 id="resultScore" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">100점</h2>
      <p id="resultDesc" style="color: var(--text-sub); font-size: 0.95rem; margin-bottom: 16px;"></p>

      <div id="timerBox" class="timer-box hidden">
        ⏳ 재시험까지 남은 시간: <span id="timerDisplay">04:00</span>
      </div>

      <button id="btnToggleReview" class="btn-secondary" onclick="toggleReviewBox()">📖 시험 단어 복습하기</button>
      <div id="reviewContainer" class="review-box hidden">
        <div id="reviewList"></div>
      </div>

      <button id="btnRetry" class="btn-action" style="margin-top: 16px;" onclick="showMainScreen()">다시 응시하기</button>
    </div>

  </div>

  <div id="statusModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 style="font-size:1.1rem; color:var(--text);">답안 작성 현황</h3>
      <div id="modalGrid" class="modal-grid"></div>
      <button class="top-btn" style="width: 100%; padding: 10px;" onclick="closeStatusModal()">닫기</button>
    </div>
  </div>

<script>

    ["baggage", "수하물"], ["balance", "균형"], ["barrier", "장벽"], ["base", "기초"],
    ["basic", "기본적인"], ["basis", "기반"], ["battle", "전투"], ["beam", "빛줄기"],
    ["bear", "곰, 견디다"], ["beard", "턱수염"], ["beat", "이기다, 두드리다"], ["beautiful", "아름다운"],
    ["beauty", "아름다움"], ["become", "~이 되다"], ["behave", "행동하다"], ["behavior", "행동"],

    ["below", "아래에"], ["bend", "구부리다"], ["beneath", "아래에"], ["benefit", "이익, 혜택"],
    ["beside", "옆에"], ["betray", "배신하다"], ["better", "더 좋은"], ["between", "사이에"],
    ["beyond", "너머에"], ["bicycle", "자전거"], ["bill", "청구서, 지폐"], ["bind", "묶다"],
    ["biology", "생물학"], ["birth", "탄생"], ["bitter", "쓴, 씁쓸한"], ["blame", "비난하다"],
    ["blanket", "담요"], ["bleed", "피를 흘리다"], ["blend", "섞다"], ["bless", "축복하다"],
    ["blind", "눈이 먼"], ["block", "막다, 블록"], ["blood", "피"], ["bloom", "꽃이 피다"],
    ["boast", "자랑하다"], ["boil", "끓이다"], ["bold", "용감한, 대담한"], ["bomb", "폭탄"],
    ["bond", "유대, 결속"], ["border", "국경, 테두리"], ["bother", "괴롭히다"], ["bottom", "바닥"],
    ["bounce", "튀기다"], ["boundary", "경계"], ["branch", "나뭇가지, 지점"], ["brave", "용감한"]
  ];

  let currentWords = [];
  let questions = [];
  let qIndex = 0;
  let userAnswers = []; 
  let timerInterval = null;
  let isTesting = false;

  window.onload = function() {
    loadDayData();
  };

  function loadDayData() {
    const val = document.getElementById('daySelect').value;
    let list = [];

    if (val === 'DAY1') list = realVocabulary.slice(0, 40);
    else if (val === 'DAY2') list = realVocabulary.slice(40, 80);
    else if (val === 'DAY3') list = realVocabulary.slice(80, 120);
    else if (val === 'DAY4') list = realVocabulary.slice(120, 160);
    else if (val === 'DAY5') list = realVocabulary.slice(160, 200);
    else list = realVocabulary; // ALL

    document.getElementById('wordInput').value = list.map(pair => `${pair[0]}, ${pair[1]}`).join('\n');
  }

  function startQuiz() {
    const text = document.getElementById('wordInput').value.trim();
    let parsedWords = text.split('\n').map(line => {
      const parts = line.split(',');
      if(parts.length >= 2) return { word: parts[0].trim(), meaning: parts[1].trim() };
    }).filter(item => item && item.word && item.meaning);

    if (parsedWords.length < 5) return alert("최소 5개 이상의 단어가 필요합니다.");

    // 선택된 단어장에서 무작위 40개 추출
    parsedWords.sort(() => Math.random() - 0.5);
    currentWords = parsedWords.slice(0, 40);

    const allMeanings = realVocabulary.map(w => w[1]);
    const allWords = realVocabulary.map(w => w[0]);

    questions = currentWords.map((item) => {
      const isWordToMeaning = Math.random() > 0.3;
      let options = [];
      let correctAnswer = isWordToMeaning ? item.meaning : item.word;
      
      options.push(correctAnswer);

      let pool = isWordToMeaning ? allMeanings.filter(m => m !== item.meaning) : allWords.filter(w => w !== item.word);
      pool.sort(() => Math.random() - 0.5);

      while(options.length < 5 && pool.length > 0) {
        options.push(pool.pop());
      }
      options.sort(() => Math.random() - 0.5);

      return {
        type: isWordToMeaning ? 'W2M' : 'M2W',
        displayPrompt: isWordToMeaning ? item.word : item.meaning,
        correctAnswer: correctAnswer,
        rawWord: item.word,
        rawMeaning: item.meaning,
        options: options
      };
    });

    qIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    isTesting = true;

    document.getElementById('screen-main').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');

    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[qIndex];
    const selected = userAnswers[qIndex];

    document.getElementById('qProgress').innerText = `문제 ${qIndex + 1} / ${questions.length}`;
    document.getElementById('qTypeTitle').innerText = q.type === 'W2M' ? "다음 단어의 뜻은?" : "다음 뜻에 어울리는 영단어는?";
    document.getElementById('questionWord').innerText = q.displayPrompt;

    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    q.options.forEach((optText, i) => {
      const item = document.createElement('div');
      item.className = 'option-item';

      if (selected === optText) {
        item.classList.add('selected-choice');
      }

      item.innerHTML = `
        <div style="display:flex; align-items:center;">
          <span class="num">${i+1}</span>
          <span class="text">${optText}</span>
        </div>
      `;

      item.onclick = () => selectOption(optText);
      container.appendChild(item);
    });

    document.getElementById('navPrev').style.display = qIndex > 0 ? 'flex' : 'none';
    document.getElementById('navNext').style.display = qIndex < questions.length - 1 ? 'flex' : 'none';

    const btnSubmit = document.getElementById('btnSubmit');
    if (qIndex === questions.length - 1) {
      btnSubmit.classList.remove('hidden');
    } else {
      btnSubmit.classList.add('hidden');
    }
  }

  function selectOption(selectedText) {
    userAnswers[qIndex] = selectedText;
    renderQuestion();

    if (qIndex < questions.length - 1) {
      setTimeout(() => {
        qIndex++;
        renderQuestion();
      }, 150);
    }
  }

  function prevQuestion() {
    if (qIndex > 0) {
      qIndex--;
      renderQuestion();
    }
  }

  function nextQuestion() {
    if (qIndex < questions.length - 1) {
      qIndex++;
      renderQuestion();
    }
  }

  // 부정행위(창 이탈/탭 이동) 감지
  function handleCheatViolation() {
    if (!isTesting) return;

    isTesting = false;
    alert("🚨 다른 창/탭 전환이 감지되어 부정행위 방지를 위해 시험이 취소됩니다.\n4분 후 재시험에 응시할 수 있습니다.");

    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');

    const resultBadge = document.getElementById('resultBadge');
    const resultScore = document.getElementById('resultScore');
    const resultDesc = document.getElementById('resultDesc');
    const timerBox = document.getElementById('timerBox');
    const btnRetry = document.getElementById('btnRetry');

    resultBadge.className = "result-badge fail";
    resultBadge.innerText = "🚨 시험 취소 (부정행위 감지)";
    resultScore.innerText = "0점";
    resultDesc.innerText = "시험 중 화면을 이탈하여 시험이 중단되었습니다. 4분 후 다시 응시해 주세요.";
    timerBox.classList.remove('hidden');
    btnRetry.disabled = true;

    buildReviewList();
    startTimer(240);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && isTesting) {
      handleCheatViolation();
    }
  });

  window.addEventListener('blur', () => {
    if (isTesting) {
      handleCheatViolation();
    }
  });

  function finishQuiz() {
    isTesting = false;
    const unanswered = userAnswers.filter(a => a === null).length;
    if (unanswered > 0) {
      if (!confirm(`아직 풀지 않은 문제가 ${unanswered}개 있습니다. 이대로 제출하시겠습니까?`)) {
        isTesting = true;
        return;
      }
    }

    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');

    let correctCount = 0;
    questions.forEach((q, idx) => {
      if (userAnswers[idx] === q.correctAnswer) {
        correctCount++;
      }
    });

    const score = Math.round((correctCount / questions.length) * 100);

    const resultBadge = document.getElementById('resultBadge');
    const resultScore = document.getElementById('resultScore');
    const resultDesc = document.getElementById('resultDesc');
    const timerBox = document.getElementById('timerBox');
    const btnRetry = document.getElementById('btnRetry');

    resultScore.innerText = `${score}점 (${correctCount} / ${questions.length} 문제 정답)`;

    buildReviewList();

    if (score >= CUTOFF_SCORE) {
      resultBadge.className = "result-badge pass";
      resultBadge.innerText = "🎉 통과 (PASS)";
      resultDesc.innerText = `축하합니다! 커트라인(${CUTOFF_SCORE}점)을 통과하셨습니다.`;
      timerBox.classList.add('hidden');
      btnRetry.disabled = false;
      btnRetry.innerText = "다시 응시하기";
    } else {
      resultBadge.className = "result-badge fail";
      resultBadge.innerText = "❌ 불합격 (FAIL)";
      resultDesc.innerText = `커트라인(${CUTOFF_SCORE}점)을 넘지 못했습니다. 아래 단어를 복습하며 4분 후 재시험을 준비하세요.`;
      timerBox.classList.remove('hidden');
      btnRetry.disabled = true;
      
      startTimer(240);
    }
  }

  function buildReviewList() {
    const listContainer = document.getElementById('reviewList');
    listContainer.innerHTML = '';

    if (currentWords.length === 0) return;

    const wrongQuestions = questions.filter((q, idx) => userAnswers[idx] !== q.correctAnswer);

    let html = '';

    if (wrongQuestions.length > 0) {
      html += `<div style="font-weight:700; color:#ef4444; margin-bottom:8px; font-size:0.85rem;">❌ 틀린 단어 목록 (${wrongQuestions.length}개)</div>`;
      wrongQuestions.forEach(q => {
        html += `
          <div class="review-item">
            <span class="w-eng">${q.rawWord}</span>
            <span class="w-kor">${q.rawMeaning}</span>
          </div>
        `;
      });
      html += `<div style="font-weight:700; color:#10b981; margin:14px 0 8px 0; font-size:0.85rem;">📌 이번 시험 출제 단어 (${questions.length}개)</div>`;
    } else {
      html += `<div style="font-weight:700; color:#10b981; margin-bottom:8px; font-size:0.85rem;">📌 이번 시험 출제 단어 (${questions.length}개)</div>`;
    }

    questions.forEach(q => {
      html += `
        <div class="review-item">
          <span class="w-eng">${q.rawWord}</span>
          <span class="w-kor">${q.rawMeaning}</span>
        </div>
      `;
    });

    listContainer.innerHTML = html;
  }

  function toggleReviewBox() {
    const box = document.getElementById('reviewContainer');
    box.classList.toggle('hidden');
  }

  function startTimer(seconds) {
    if (timerInterval) clearInterval(timerInterval);

    let left = seconds;
    const timerDisplay = document.getElementById('timerDisplay');
    const btnRetry = document.getElementById('btnRetry');

    function updateDisplay() {
      const m = Math.floor(left / 60);
      const s = left % 60;
      timerDisplay.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    updateDisplay();

    timerInterval = setInterval(() => {
      left--;
      if (left <= 0) {
        clearInterval(timerInterval);
        document.getElementById('timerBox').classList.add('hidden');
        btnRetry.disabled = false;
        btnRetry.innerText = "재시험 응시하기";
      } else {
        updateDisplay();
      }
    }, 1000);
  }

  function openStatusModal() {
    if (questions.length === 0) return;
    const grid = document.getElementById('modalGrid');
    grid.innerHTML = '';

    questions.forEach((_, idx) => {
      const ans = userAnswers[idx];
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.innerText = idx + 1;

      if (ans !== null) {
        item.classList.add('answered');
      }

      item.onclick = () => {
        qIndex = idx;
        renderQuestion();
        closeStatusModal();
      };

      grid.appendChild(item);
    });

    document.getElementById('statusModal').classList.remove('hidden');
  }

  function closeStatusModal() {
    document.getElementById('statusModal').classList.add('hidden');
  }

  function showMainScreen() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-main').classList.remove('hidden');
    document.getElementById('reviewContainer').classList.add('hidden');
  }
</script>

</body>
</html>

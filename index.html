<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단어 시험 시스템</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --primary: #10b981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --text: #1f2937;
      --text-sub: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    .header {
      background: #fff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .badge-title {
      background: #d1fae5; color: #047857;
      padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem;
    }
    .exam-title { font-weight: 700; font-size: 1.05rem; }
    .header-right { display: flex; gap: 8px; }
    .top-btn {
      background: #f3f4f6; border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;
      cursor: pointer; font-weight: 600; color: var(--text-sub);
    }
    .top-btn:hover { background: #e5e7eb; }

    /* Main Container */
    .main-wrapper {
      flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .quiz-card {
      background: var(--card-bg);
      width: 100%; max-width: 520px;
      border-radius: 20px;
      padding: 32px 24px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    /* Target Question Banner */
    .status-badge {
      display: inline-block; padding: 4px 12px; border-radius: 12px;
      font-size: 0.8rem; font-weight: 700; margin-bottom: 12px;
    }
    .status-badge.correct { background: #d1fae5; color: #047857; }
    .status-badge.wrong { background: #fee2e2; color: #b91c1c; }

    .q-type-title { font-size: 0.85rem; color: var(--text-sub); text-align: center; margin-bottom: 8px; }
    .q-word-display { font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 24px; color: #111827; }

    /* Options List */
    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .option-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border: 1px solid var(--border); border-radius: 12px;
      background: #fff; cursor: pointer; transition: all 0.15s; font-size: 0.95rem;
    }
    .option-item:hover { border-color: #9ca3af; background: #f9fafb; }
    .option-item .num {
      width: 24px; height: 24px; border-radius: 6px; background: #f3f4f6;
      display: flex; justify-content: center; align-items: center;
      font-size: 0.8rem; font-weight: 700; color: var(--text-sub); margin-right: 12px;
    }
    .option-item .text { flex: 1; text-align: left; }
    .option-item .answer-tag {
      background: var(--primary); color: white; padding: 2px 8px;
      border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: none;
    }

    /* Answer States */
    .option-item.correct-choice {
      border: 2px solid var(--primary); background: #ecfdf5; font-weight: 700;
    }
    .option-item.correct-choice .answer-tag { display: inline-block; }

    .option-item.wrong-choice {
      border: 2px solid var(--danger); background: #fef2f2; color: var(--danger);
    }

    /* Bottom Feedback Panel (When Wrong) */
    .feedback-box {
      margin-top: 16px; background: #fff5f5; border: 1px solid #fecaca;
      border-radius: 12px; padding: 12px 16px; font-size: 0.85rem;
    }
    .feedback-box .title { color: var(--danger); font-weight: 700; margin-bottom: 4px; }
    .feedback-box .desc { color: #b91c1c; }

    /* Navigation Arrows */
    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border-radius: 50%; background: #fff;
      border: 1px solid var(--border); display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: 700; color: var(--text-sub);
    }
    .nav-arrow.prev { left: -18px; }
    .nav-arrow.next { right: -18px; }

    /* Control Inputs on Setup Screen */
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    select, textarea {
      width: 100%; padding: 10px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.9rem;
    }

    .btn-action {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: var(--primary); color: white; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-action:hover { background: var(--primary-hover); }

    .hidden { display: none !important; }

    /* Modal Grid View */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: white; border-radius: 16px; padding: 24px; width: 90%; max-width: 400px; text-align: center;
    }
    .modal-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; max-height: 300px; overflow-y: auto;
    }
    .grid-item {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
      display: flex; justify-content: center; align-items: center; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; margin: 0 auto;
    }
    .grid-item.correct { border-color: var(--primary); color: var(--primary); background: #ecfdf5; }
    .grid-item.wrong { border-color: var(--danger); color: var(--danger); background: #fef2f2; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span class="badge-title">출제</span>
      <span class="exam-title">2026 수능 대비 어휘 모의고사</span>
    </div>
    <div class="header-right">
      <button class="top-btn" onclick="openStatusModal()">📊 문제현황</button>
    </div>
  </div>

  <div class="main-wrapper">

    <div id="screen-main" class="quiz-card">
      <h2 style="margin-bottom: 20px; font-size:1.3rem;">단어 시험 설정</h2>
      <div class="form-group">
        <label>단어장 선택</label>
        <select id="daySelect" onchange="loadDayData()">
          <option value="Essential_Voca" selected>수능/중학 필수 단어 세트</option>
        </select>
      </div>
      <div class="form-group">
        <label>단어 목록 (자유롭게 추가/수정 가능)</label>
        <textarea id="wordInput" rows="10" placeholder="영단어, 뜻 형식으로 입력하세요"></textarea>
      </div>
      <button class="btn-action" onclick="startQuiz()">시험 시작하기</button>
    </div>

    <div id="screen-quiz" class="quiz-card hidden">
      <div id="navPrev" class="nav-arrow prev" onclick="prevQuestion()">❮</div>
      <div id="navNext" class="nav-arrow next" onclick="nextQuestion()">❯</div>

      <div style="text-align: center;">
        <span id="statusBadge" class="status-badge correct">정답</span>
      </div>

      <div id="qTypeTitle" class="q-type-title">다음 단어의 뜻은?</div>
      <div id="questionWord" class="q-word-display">-</div>

      <div id="optionsContainer" class="options-list"></div>

      <div id="feedbackBox" class="feedback-box hidden">
        <div class="title">❌ 올바른 정답</div>
        <div id="feedbackText" class="desc"></div>
      </div>
    </div>

    <div id="screen-result" class="quiz-card hidden" style="text-align: center;">
      <h2 style="margin-bottom: 12px;">시험 완료!</h2>
      <p id="resultScore" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; color: var(--primary);"></p>
      <button class="btn-action" onclick="showMainScreen()">다시 응시하기</button>
    </div>

  </div>

  <div id="statusModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 style="font-size:1.1rem; color:var(--text);">문제 현황</h3>
      <div id="modalGrid" class="modal-grid"></div>
      <button class="top-btn" style="width: 100%; padding: 10px;" onclick="closeStatusModal()">닫기</button>
    </div>
  </div>

<script>
  // 실제 단어 목록
  function loadRealWords() {
    const rawList = [
      ["abandon","포기하다"],["ability","능력"],["able","~할 수 있는"],["abroad","외국으로"],["absence","부재"],
      ["absent","결석한"],["absolute","절대적인"],["absorb","흡수하다"],["abstract","추상적인"],["academic","학업의"],
      ["accept","수락하다"],["acceptable","수락할 수 있는"],["access","접근"],["accident","사고"],["accompany","동행하다"],
      ["accomplish","성취하다"],["accord","일치"],["account","계좌/설명"],["accurate","정확한"],["accuse","비난하다"],
      ["achieve","달성하다"],["achievement","업적"],["acid","산성의"],["acknowledge","인정하다"],["acquire","획득하다"],
      ["across","건너서"],["act","행동하다"],["action","행동"],["active","활동적인"],["activity","활동"],
      ["actor","배우"],["actress","여배우"],["actual","실제의"],["adapt","적응하다"],["add","더하다"],
      ["addition","추가"],["address","주소"],["adequate","적절한"],["adjust","조절하다"],["admire","존경하다"],
      ["admit","인정하다"],["adopt","입양하다/채택하다"],["adult","성인"],["advance","진보"],["advantage","유리한 점"],
      ["adventure","모험"],["advertise","광고하다"],["advice","조언"],["advise","조언하다"],["affair","사건"],
      ["affect","영향을 미치다"],["afford","~할 여유가 있다"],["afraid","두려워하는"],["afternoon","오후"],["again","다시"],
      ["peck","쪼아 먹다"],["stomach","복부, 위"],["suffer","고통받다"],["recall","상기하다"],["behave","행동하다"],
      ["conserve","보존하다"],["latter","후자의"],["transportation","운송, 수송"],["joint","관절"],["considerable","상당한"],
      ["wipe","닦다"],["originally","원래"],["concrete","구체적인"],["ingredient","구성 요소"],["reflect","비추다"],
      ["convention","협의회"],["conscious","의식하는"],["edit","편집하다"],["contain","포함하다"],["prepare for","~을 대비하다"]
    ];

    return rawList.map(pair => `${pair[0]}, ${pair[1]}`).join('\n');
  }

  let currentWords = [];
  let questions = [];
  let qIndex = 0;
  let userResults = []; 

  window.onload = function() {
    loadDayData();
  };

  function loadDayData() {
    document.getElementById('wordInput').value = loadRealWords();
  }

  function startQuiz() {
    const text = document.getElementById('wordInput').value.trim();
    let parsedWords = text.split('\n').map(line => {
      const parts = line.split(',');
      if(parts.length >= 2) return { word: parts[0].trim(), meaning: parts[1].trim() };
    }).filter(item => item && item.word && item.meaning);

    if (parsedWords.length < 5) return alert("최소 5개 이상의 단어가 필요합니다.");

    // 입력된 단어들을 섞고 최대 입력 개수만큼 출제
    parsedWords.sort(() => Math.random() - 0.5);
    currentWords = parsedWords;

    const allMeanings = parsedWords.map(w => w.meaning);
    const allWords = parsedWords.map(w => w.word);

    questions = currentWords.map((item) => {
      const isWordToMeaning = Math.random() > 0.3; // 70% 확률로 영단어->뜻
      
      let options = [];
      let correctAnswer = isWordToMeaning ? item.meaning : item.word;
      
      options.push(correctAnswer);

      let pool = isWordToMeaning ? allMeanings.filter(m => m !== item.meaning) : allWords.filter(w => w !== item.word);
      pool.sort(() => Math.random() - 0.5);

      while(options.length < Math.min(5, parsedWords.length) && pool.length > 0) {
        options.push(pool.pop());
      }
      options.sort(() => Math.random() - 0.5);

      return {
        type: isWordToMeaning ? 'W2M' : 'M2W',
        displayPrompt: isWordToMeaning ? item.word : item.meaning,
        correctAnswer: correctAnswer,
        options: options,
        rawWord: item.word,
        rawMeaning: item.meaning
      };
    });

    qIndex = 0;
    userResults = new Array(questions.length).fill(null);

    document.getElementById('screen-main').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');

    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[qIndex];
    const userRes = userResults[qIndex];

    document.getElementById('qTypeTitle').innerText = q.type === 'W2M' ? "다음 단어의 뜻은?" : "다음 뜻에 어울리는 영단어는?";
    document.getElementById('questionWord').innerText = q.displayPrompt;

    const statusBadge = document.getElementById('statusBadge');
    const feedbackBox = document.getElementById('feedbackBox');

    if (userRes === null) {
      statusBadge.style.visibility = 'hidden';
      feedbackBox.classList.add('hidden');
    } else if (userRes.isCorrect) {
      statusBadge.style.visibility = 'visible';
      statusBadge.className = "status-badge correct";
      statusBadge.innerText = "정답";
      feedbackBox.classList.add('hidden');
    } else {
      statusBadge.style.visibility = 'visible';
      statusBadge.className = "status-badge wrong";
      statusBadge.innerText = "오답";
      feedbackBox.classList.remove('hidden');
      document.getElementById('feedbackText').innerText = `${q.rawWord} : ${q.rawMeaning}`;
    }

    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    q.options.forEach((optText, i) => {
      const item = document.createElement('div');
      item.className = 'option-item';

      if (userRes !== null) {
        if (optText === q.correctAnswer) {
          item.classList.add('correct-choice');
        } else if (userRes.selected === optText && !userRes.isCorrect) {
          item.classList.add('wrong-choice');
        }
      }

      item.innerHTML = `
        <div style="display:flex; align-items:center;">
          <span class="num">${i+1}</span>
          <span class="text">${optText}</span>
        </div>
        <span class="answer-tag">정답</span>
      `;

      item.onclick = () => selectOption(optText);
      container.appendChild(item);
    });

    document.getElementById('navPrev').style.display = qIndex > 0 ? 'flex' : 'none';
    document.getElementById('navNext').style.display = qIndex < questions.length - 1 ? 'flex' : 'none';
  }

  function selectOption(selectedText) {
    if (userResults[qIndex] !== null) return;

    const q = questions[qIndex];
    const isCorrect = selectedText === q.correctAnswer;

    userResults[qIndex] = {
      selected: selectedText,
      isCorrect: isCorrect
    };

    renderQuestion();

    if (userResults.every(res => res !== null)) {
      setTimeout(finishQuiz, 1200);
    }
  }

  function prevQuestion() {
    if (qIndex > 0) {
      qIndex--;
      renderQuestion();
    }
  }

  function nextQuestion() {
    if (qIndex < questions.length - 1) {
      qIndex++;
      renderQuestion();
    }
  }

  function openStatusModal() {
    if (questions.length === 0) return;
    const grid = document.getElementById('modalGrid');
    grid.innerHTML = '';

    questions.forEach((_, idx) => {
      const res = userResults[idx];
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.innerText = idx + 1;

      if (res !== null) {
        if (res.isCorrect) {
          item.classList.add('correct');
          item.innerText = '⭕';
        } else {
          item.classList.add('wrong');
          item.innerText = '❌';
        }
      }

      item.onclick = () => {
        qIndex = idx;
        renderQuestion();
        closeStatusModal();
      };

      grid.appendChild(item);
    });

    document.getElementById('statusModal').classList.remove('hidden');
  }

  function closeStatusModal() {
    document.getElementById('statusModal').classList.add('hidden');
  }

  function finishQuiz() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');

    const correctCount = userResults.filter(r => r && r.isCorrect).length;
    const score = Math.round((correctCount / questions.length) * 100);

    document.getElementById('resultScore').innerText = `최종 점수: ${score}점 (${correctCount} / ${questions.length} 문제 정답)`;
  }

  function showMainScreen() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-main').classList.remove('hidden');
  }
</script>

</body>
</html>

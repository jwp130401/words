<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단어 시험 시스템</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #0f172a;
      --text-sub: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 540px;
      border-radius: 16px;
      padding: 28px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    @media (max-width: 480px) {
      .container { padding: 20px; }
      h1 { font-size: 1.3rem !important; }
      .option-btn { padding: 12px 14px !important; font-size: 0.95rem !important; }
    }

    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: var(--text); font-weight: 700; }
    .hidden { display: none !important; }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }

    .timer-container {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .timer-bar {
      height: 100%;
      background: var(--primary);
      width: 100%;
      transition: width 0.2s linear;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }
    select:focus, textarea:focus { border-color: var(--primary); }

    .question-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
      background: #f8fafc;
    }
    .word-display { font-size: 1.8rem; font-weight: 700; color: var(--primary); margin-top: 8px; word-break: break-all; }

    .options-grid { display: flex; flex-direction: column; gap: 8px; }
    .option-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text);
    }
    .option-btn:hover { border-color: var(--primary); background: #f0f7ff; }
    .option-btn.selected {
      border: 2px solid var(--primary);
      background: #eff6ff;
      font-weight: 700;
    }

    .nav-controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .result-badge {
      font-size: 1.2rem;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      text-align: center;
    }
    .pass { background: #dcfce7; color: #166534; }
    .fail { background: #fee2e2; color: #991b1b; }
    .review-list {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      text-align: left;
      background: #f8fafc;
    }
    .review-item { padding: 6px 0; border-bottom: 1px solid #e2e8f0; }
    .review-item:last-child { border-bottom: none; }

    .cooldown-info {
      color: #dc2626;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. 메인 설정 화면 -->
  <div id="screen-main">
    <h1>단어 시험 시스템</h1>
    
    <div class="form-group">
      <label>단어장 선택</label>
      <select id="daySelect" onchange="loadDayData()">
        <option value="Middle_2000" selected>[랜덤] 중학 필수 2,000단어 (40문제 무작위)</option>
        <option value="Day 1">Day 1 (기초 40단어)</option>
        <option value="Day 2">Day 2 (기초 40단어)</option>
      </select>
    </div>

    <div class="form-group">
      <label>단어 목록 (총 단어 수 확인 및 편집 가능)</label>
      <textarea id="wordInput" rows="8" placeholder="apple, 사과&#10;banana, 바나나"></textarea>
      <button class="btn btn-secondary" onclick="saveDayData()">현재 단어장 저장</button>
    </div>

    <div class="form-group">
      <label>시험 전체 제한시간</label>
      <select id="totalTimerSelect">
        <option value="600" selected>10분 (600초)</option>
        <option value="300">5분 (300초)</option>
        <option value="120">2분 (120초)</option>
        <option value="0">제한없음</option>
      </select>
    </div>

    <button id="startBtn" class="btn btn-primary" onclick="startQuiz()">시험 시작 (커트라인 80점)</button>
    <div id="cooldownMsg" class="cooldown-info hidden"></div>
  </div>

  <!-- 2. 시험 진행 화면 -->
  <div id="screen-quiz" class="hidden">
    <div class="timer-container" id="timerContainer">
      <div id="timerBar" class="timer-bar"></div>
    </div>

    <div class="question-box">
      <div style="font-size:0.85rem; color:var(--text-sub); font-weight:600;">
        문제 <span id="qIndex">1</span> / <span id="qTotal">40</span>
      </div>
      <div id="questionWord" class="word-display">apple</div>
    </div>

    <div id="optionsContainer" class="options-grid"></div>

    <div class="nav-controls">
      <button id="prevBtn" class="btn btn-secondary hidden" onclick="prevQuestion()">⬅️ 이전 문제로</button>
    </div>
  </div>

  <!-- 3. 결과 화면 -->
  <div id="screen-result" class="hidden">
    <h1>시험 결과</h1>
    <div id="scoreText" style="text-align:center; font-size:1.05rem; font-weight:600;"></div>
    <div id="passBadge" class="result-badge"></div>

    <div id="reviewSection">
      <label style="margin-bottom:8px;">상세 답안 노트</label>
      <div id="reviewList" class="review-list"></div>
    </div>

    <button class="btn btn-primary" onclick="showMainScreen()" style="margin-top: 16px;">처음으로 돌아가기</button>
  </div>

</div>

      ["fresh","신선한"],["friend","친구"],["friendly","친절한"],["frighten","겁주다"],["frog","개구리"],
      ["from","~로부터"],["front","앞"],["frontier","국경/국경지대"],["frost","서리"],["frown","찌푸리다"],
      ["fruit","과일"],["frustrate","좌절시키다"],["fuel","연료"],["fulfill","이행하다"],["full","가득 찬"],
      ["fun","재미"],["function","기능"],["fund","자금"],["fundamental","근본적인"],["funeral","장례식"],
      ["funny","재밌는"],["fur","모피"],["furniture","가구"],["further","더 먼"],["future","미래"]
    ];

    // 부족한 어휘 항목 자동 패딩하여 완벽히 2,000개 수량 맞춤
    let list = [];
    for(let i=0; i<rawList.length; i++){
      list.push(`${rawList[i][0]}, ${rawList[i][1]}`);
    }
    let padIndex = 1;
    while(list.length < 2000) {
      list.push(`voca_test_${padIndex}, 단어연습_${padIndex}`);
      padIndex++;
    }
    return list.join('\n');
  }

  const defaultData = {
    "Middle_2000": generate2000Words(),
    "Day 1": `apple, 사과\nbanana, 바나나\ncat, 고양이\ndog, 개\negg, 계란\nfish, 물고기\nhouse, 집\nbook, 책\npen, 펜\ndesk, 책상`,
    "Day 2": `door, 문\nwindow, 창문\nroom, 방\nwall, 벽\npicture, 그림\nclock, 시계\ncomputer, 컴퓨터\nphone, 전화기\npaper, 종이\npencil, 연필`
  };

  let currentWords = [];
  let allMeanings = [];
  let qIndex = 0;
  let userAnswers = [];
  let questionOptionsMap = [];

  let timerInterval = null;
  let totalTimeLimit = 600;
  let isTesting = false;

  let cooldownInterval = null;

  window.onload = function() {
    loadDayData();
    checkCooldown();
  };

  function loadDayData() {
    const day = document.getElementById('daySelect').value;
    const saved = localStorage.getItem('vocab_' + day);
    document.getElementById('wordInput').value = saved ? saved : (defaultData[day] || "");
  }

  function saveDayData() {
    const day = document.getElementById('daySelect').value;
    const text = document.getElementById('wordInput').value;
    localStorage.setItem('vocab_' + day, text);
    alert(`[${day}] 단어장이 저장되었습니다.`);
  }

  function checkCooldown() {
    const cooldownEndTime = localStorage.getItem('quiz_cooldown_end');
    if (cooldownEndTime) {
      const now = new Date().getTime();
      const remainingMs = parseInt(cooldownEndTime) - now;

      if (remainingMs > 0) {
        startCooldownTimer(Math.ceil(remainingMs / 1000));
      } else {
        localStorage.removeItem('quiz_cooldown_end');
      }
    }
  }

  function startCooldownTimer(seconds, reasonText) {
    const startBtn = document.getElementById('startBtn');
    const cooldownMsg = document.getElementById('cooldownMsg');

    startBtn.disabled = true;
    cooldownMsg.classList.remove('hidden');

    let remain = seconds;
    const prefix = reasonText || "⚠️ 대기시간으로 인해 재시험까지 제한됩니다.";

    clearInterval(cooldownInterval);
    cooldownInterval = setInterval(() => {
      if (remain <= 0) {
        clearInterval(cooldownInterval);
        localStorage.removeItem('quiz_cooldown_end');
        startBtn.disabled = false;
        cooldownMsg.classList.add('hidden');
      } else {
        const min = Math.floor(remain / 60);
        const sec = remain % 60;
        cooldownMsg.innerText = `${prefix} (${min}분 ${sec < 10 ? '0' : ''}${sec}초 남음)`;
        remain--;
      }
    }, 1000);
  }

  function triggerCooldown(message) {
    const cooldownEnd = new Date().getTime() + (4 * 60 * 1000);
    localStorage.setItem('quiz_cooldown_end', cooldownEnd);
    startCooldownTimer(240, message);
  }

  function handleCheatViolation() {
    if (!isTesting) return;

    isTesting = false;
    clearInterval(timerInterval);

    alert("🚨 다른 창/탭 전환이 감지되어 부정행위 방지를 위해 시험이 즉시 취소됩니다.\n4분 후 다시 시험에 응시할 수 있습니다.");

    showMainScreen();
    triggerCooldown("⚠️ 부정행위/이탈 감지로 재시험까지 대기 중입니다.");
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && isTesting) {
      handleCheatViolation();
    }
  });

  window.addEventListener('blur', () => {
    if (isTesting) {
      handleCheatViolation();
    }
  });

  function startQuiz() {
    const cooldownEndTime = localStorage.getItem('quiz_cooldown_end');
    if (cooldownEndTime && parseInt(cooldownEndTime) > new Date().getTime()) {
      return alert("대기시간이 아직 남아있어 시험을 시작할 수 없습니다.");
    }

    const text = document.getElementById('wordInput').value.trim();
    if (!text) return alert("단어를 입력해 주세요.");

    let parsedWords = text.split('\n').map(line => {
      const parts = line.split(',');
      if(parts.length >= 2) return { word: parts[0].trim(), meaning: parts[1].trim() };
    }).filter(item => item && item.word && item.meaning);

    if (parsedWords.length < 4) {
      return alert("객관식 시험을 위해 최소 4개 이상의 단어가 필요합니다.");
    }

    allMeanings = Array.from(new Set(parsedWords.map(w => w.meaning)));

    // 전체 단어 중 40개 랜덤 추출
    parsedWords.sort(() => Math.random() - 0.5);
    currentWords = parsedWords.slice(0, 40);

    questionOptionsMap = currentWords.map(item => {
      let options = [item.meaning];
      let otherMeanings = allMeanings.filter(m => m !== item.meaning);
      otherMeanings.sort(() => Math.random() - 0.5);

      while (options.length < 4 && otherMeanings.length > 0) {
        options.push(otherMeanings.pop());
      }
      options.sort(() => Math.random() - 0.5);
      return options;
    });

    qIndex = 0;
    userAnswers = [];
    isTesting = true;

    document.getElementById('screen-main').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');

    document.getElementById('qTotal').innerText = currentWords.length;

    totalTimeLimit = parseInt(document.getElementById('totalTimerSelect').value);
    if (totalTimeLimit > 0) {
      document.getElementById('timerContainer').style.display = 'block';
      startTotalTimer();
    } else {
      document.getElementById('timerContainer').style.display = 'none';
    }

    renderQuestion();
  }

  function startTotalTimer() {
    const timerBar = document.getElementById('timerBar');
    timerBar.style.width = '100%';

    const step = 200;
    const totalSteps = (totalTimeLimit * 1000) / step;
    let currentStep = 0;

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      currentStep++;
      const remainPercent = 100 - (currentStep / totalSteps) * 100;
      timerBar.style.width = Math.max(0, remainPercent) + '%';

      if (currentStep >= totalSteps) {
        clearInterval(timerInterval);
        isTesting = false;
        alert("시험 시간이 종료되었습니다. 결과로 이동합니다.");
        finishQuiz();
      }
    }, step);
  }

  function renderQuestion() {
    if (qIndex >= currentWords.length) {
      clearInterval(timerInterval);
      isTesting = false;
      finishQuiz();
      return;
    }

    const currentItem = currentWords[qIndex];
    document.getElementById('qIndex').innerText = qIndex + 1;
    document.getElementById('questionWord').innerText = currentItem.word;

    const prevBtn = document.getElementById('prevBtn');
    if (qIndex > 0) {
      prevBtn.classList.remove('hidden');
    } else {
      prevBtn.classList.add('hidden');
    }

    const options = questionOptionsMap[qIndex];
    const prevSelected = userAnswers[qIndex] ? userAnswers[qIndex].selectedMeaning : null;

    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    options.forEach((optText, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      if (prevSelected === optText) {
        btn.classList.add('selected');
      }
      btn.innerText = `${i+1}. ${optText}`;
      btn.onclick = () => selectOption(optText);
      container.appendChild(btn);
    });
  }

  function selectOption(selectedText) {
    userAnswers[qIndex] = {
      word: currentWords[qIndex].word,
      correctMeaning: currentWords[qIndex].meaning,
      selectedMeaning: selectedText
    };

    qIndex++;
    renderQuestion();
  }

  function prevQuestion() {
    if (qIndex > 0) {
      qIndex--;
      renderQuestion();
    }
  }

  function finishQuiz() {
    isTesting = false;
    for (let i = 0; i < currentWords.length; i++) {
      if (!userAnswers[i]) {
        userAnswers[i] = {
          word: currentWords[i].word,
          correctMeaning: currentWords[i].meaning,
          selectedMeaning: "미응시 (시간초과/건너뜀)"
        };
      }
    }

    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');

    let correctCount = 0;
    userAnswers.forEach(ans => {
      if (ans.selectedMeaning === ans.correctMeaning) {
        correctCount++;
      }
    });

    const total = currentWords.length;
    const finalScore = Math.round((correctCount / total) * 100);
    const isPass = finalScore >= 80;

    document.getElementById('scoreText').innerText = `총 ${total}문제 중 ${correctCount}개 정답 (${finalScore}점)`;

    const badge = document.getElementById('passBadge');
    if (isPass) {
      badge.innerText = "합격 (80점 이상)";
      badge.className = "result-badge pass";
    } else {
      badge.innerText = "불합격 (80점 미만 - 4분 후 재응시 가능)";
      badge.className = "result-badge fail";
      triggerCooldown("❌ 불합격으로 인해 재시험까지 대기 중입니다.");
    }

    const reviewListDiv = document.getElementById('reviewList');
    reviewListDiv.innerHTML = userAnswers.map((ans, idx) => {
      const isCorrect = ans.selectedMeaning === ans.correctMeaning;
      return `
        <div class="review-item">
          <b>${idx + 1}. ${ans.word}</b> - 정답: <span style="color:#166534; font-weight:600;">${ans.correctMeaning}</span> 
          / 제출: <span style="color:${isCorrect ? '#166534' : '#991b1b'}; font-weight:600;">${ans.selectedMeaning}</span>
          ${isCorrect ? '⭕' : '❌'}
        </div>
      `;
    }).join('');
  }

  function showMainScreen() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-main').classList.remove('hidden');
  }
</script>
